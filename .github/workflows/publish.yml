name: publish Docker Hub image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.4.0)
        type: string
        required: true
      latest:
        description: Also update the latest tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dockerhub-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/lint.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = push ]; then
            version="${REF_NAME#v}"
            latest=true
          else
            version="${INPUT_VERSION#v}"
            latest="$INPUT_LATEST"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'A stable release version such as 1.4.0 is required.' >&2
            exit 1
          fi
          printf 'version=%s\nlatest=%s\n' "$version" "$latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: miglen/phproxy
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ steps.release.outputs.latest }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish both architectures with attestations
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Record the release digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Published miglen/phproxy@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
